<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Karaoke Queue room model</title>
  <desc id="description">Performers submit through the venue and live event. A host controls the queue and a display presents the current performance.</desc>
  <style>
    .bg { fill: #080b0c; } .line { stroke: #75bfff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .box { fill: #0d1112; stroke: #26302c; stroke-width: 2; rx: 16; } .event { stroke: #86d99a; }
    .head { fill: #86d99a; font: 700 27px system-ui, sans-serif; } .body { fill: #d9e0dc; font: 19px system-ui, sans-serif; }
    .label { fill: #e5b566; font: 600 17px ui-monospace, monospace; letter-spacing: 1px; }
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#75bfff"/></marker></defs>
  <rect class="bg" width="1200" height="480"/>
  <text class="label" x="60" y="62">THE SHARED ROOM</text>
  <rect class="box" x="60" y="125" width="245" height="150"/>
  <text class="head" x="92" y="178">Performer</text><text class="body" x="92" y="215">Finds a song</text><text class="body" x="92" y="243">from a phone</text>
  <rect class="box event" x="452" y="105" width="295" height="205"/>
  <text class="head" x="485" y="163">Live event</text><text class="body" x="485" y="202">Presence, admission,</text><text class="body" x="485" y="230">queue, fair ordering</text><text class="body" x="485" y="258">and runtime boundary</text>
  <rect class="box" x="895" y="65" width="245" height="130"/>
  <text class="head" x="927" y="118">Host</text><text class="body" x="927" y="154">Runs the queue</text>
  <rect class="box" x="895" y="285" width="245" height="130"/>
  <text class="head" x="927" y="338">Display</text><text class="body" x="927" y="374">Shows now and next</text>
  <path class="line" d="M305 200 H438"/><path class="line" d="M747 165 H880"/><path class="line" d="M747 260 H860 V350 H880"/>
  <text class="label" x="333" y="180">SUBMIT</text><text class="label" x="772" y="145">MANAGE</text><text class="label" x="772" y="332">PRESENT</text>
</svg>
