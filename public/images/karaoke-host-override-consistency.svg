<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Host override consistency boundary</title>
  <desc id="desc">A host queue intervention enters an event-scoped transaction, acquires the event row lock, rewrites queue ordering, and records an auditable override before committing.</desc>
  <rect width="960" height="520" fill="#080b0c"/>

  <g font-family="ui-monospace, monospace" font-size="18" fill="#e5b566">
    <text x="60" y="62">HOST OVERRIDE · ONE EVENT CONSISTENCY BOUNDARY</text>
  </g>

  <g fill="none" stroke="#26302c" stroke-width="2">
    <rect x="55" y="145" width="160" height="110" rx="8"/>
    <rect x="270" y="145" width="170" height="110" rx="8"/>
    <rect x="495" y="145" width="170" height="110" rx="8"/>
    <rect x="720" y="145" width="185" height="110" rx="8"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="15" fill="#ecf2f8" text-anchor="middle">
    <text x="135" y="181">HOST ACTION</text>
    <text x="355" y="181">TRANSACTION</text>
    <text x="580" y="181">EVENT ROW LOCK</text>
    <text x="812" y="181">QUEUE REWRITE</text>
  </g>

  <g font-family="ui-sans-serif, sans-serif" font-size="15" fill="#d9e0dc" text-anchor="middle">
    <text x="135" y="215">pause / unpause</text>
    <text x="355" y="215">all-or-nothing</text>
    <text x="580" y="215">serialize mutations</text>
    <text x="812" y="215">stable timestamps</text>
  </g>

  <g stroke="#75bfff" stroke-width="3" fill="#75bfff">
    <line x1="215" y1="200" x2="270" y2="200"/><polygon points="270,200 260,194 260,206"/>
    <line x1="440" y1="200" x2="495" y2="200"/><polygon points="495,200 485,194 485,206"/>
    <line x1="665" y1="200" x2="720" y2="200"/><polygon points="720,200 710,194 710,206"/>
  </g>

  <path d="M812 255V330" fill="none" stroke="#7b8aa0" stroke-width="2"/>
  <polygon points="812,330 806,320 818,320" fill="#7b8aa0"/>

  <rect x="610" y="330" width="295" height="110" rx="8" fill="#132c2b" stroke="#56d6c9" stroke-width="2"/>
  <text x="757" y="365" fill="#ecf2f8" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">AUDIT RECORD</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="15" fill="#d9e0dc" text-anchor="middle">
    <text x="757" y="397">event · performance · actor</text>
    <text x="757" y="421" fill="#86d99a">action remains explainable</text>
  </g>

  <rect x="55" y="330" width="430" height="110" rx="8" fill="#221a2b" stroke="#b995d6" stroke-width="2"/>
  <text x="270" y="365" fill="#ecf2f8" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">WHY THIS BOUNDARY</text>
  <g font-family="ui-sans-serif, sans-serif" font-size="15" fill="#d9e0dc" text-anchor="middle">
    <text x="270" y="397">two host mutations should not compute</text>
    <text x="270" y="421">from the same stale event queue snapshot</text>
  </g>

  <line x1="485" y1="385" x2="610" y2="385" stroke="#86d99a" stroke-width="3"/>
  <polygon points="610,385 600,379 600,391" fill="#86d99a"/>
</svg>
