<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Defense in depth for booking correctness</title>
  <desc id="desc">Four layers protect booking correctness: request authorization, transaction-service revalidation, locked and idempotent domain state, and PostgreSQL exclusion and uniqueness constraints. The database constraint prevents two overlapping active bookings from committing.</desc>
  <rect width="960" height="480" fill="#080b0c"/><g font-family="ui-monospace, monospace"><text x="48" y="50" fill="#e5b566" font-size="18">WHERE BOOKING CORRECTNESS LIVES</text><text x="48" y="76" fill="#929e98" font-size="14">DEFENSE IN DEPTH · EACH LAYER COVERS A DIFFERENT FAILURE</text></g>
  <g fill="#101817" stroke="#26302c" stroke-width="2"><rect x="90" y="115" width="780" height="68" rx="8"/><rect x="130" y="202" width="700" height="68" rx="8"/><rect x="170" y="289" width="620" height="68" rx="8"/><rect x="210" y="376" width="540" height="68" rx="8"/></g>
  <g font-family="ui-sans-serif, sans-serif" text-anchor="middle"><text x="480" y="143" fill="#56d6c9" font-size="16" font-weight="700">1 · REQUEST AND AUTHORIZATION</text><text x="480" y="166" fill="#d9e0dc" font-size="14">actor ownership · feature access · package and policy scope</text><text x="480" y="230" fill="#56d6c9" font-size="16" font-weight="700">2 · TRANSACTION SERVICE</text><text x="480" y="253" fill="#d9e0dc" font-size="14">recheck mutable rules · validate transition · write audit event</text><text x="480" y="317" fill="#56d6c9" font-size="16" font-weight="700">3 · LOCKED DOMAIN STATE</text><text x="480" y="340" fill="#d9e0dc" font-size="14">row locks · idempotent provider events · unique outbox keys</text><text x="480" y="404" fill="#56d6c9" font-size="16" font-weight="700">4 · POSTGRESQL CONSTRAINTS</text><text x="480" y="427" fill="#d9e0dc" font-size="14">overlap exclusion · uniqueness · final concurrency arbiter</text></g>
  <g stroke="#75bfff" stroke-width="3" fill="#75bfff"><line x1="480" y1="183" x2="480" y2="199"/><path d="M480 202l-6-10h12z"/><line x1="480" y1="270" x2="480" y2="286"/><path d="M480 289l-6-10h12z"/><line x1="480" y1="357" x2="480" y2="373"/><path d="M480 376l-6-10h12z"/></g>
</svg>
