<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Booking entitlement credit ledger</title>
  <desc id="desc">Purchased credits activate as available. A booking request reserves credit; decline or eligible cancellation releases it; confirmation consumes it. Refund and forfeiture of available unused credits are recorded separately. Every movement is appended to an entitlement entry under a row lock.</desc>
  <rect width="960" height="500" fill="#080b0c"/><g font-family="ui-monospace, monospace"><text x="48" y="50" fill="#e5b566" font-size="18">BOOKING ENTITLEMENT LEDGER</text><text x="48" y="76" fill="#929e98" font-size="14">CREDIT CONSERVATION · APPEND-ONLY HISTORY</text></g>
  <g fill="#101817" stroke="#26302c" stroke-width="2"><rect x="35" y="155" width="165" height="85" rx="8"/><rect x="265" y="155" width="165" height="85" rx="8"/><rect x="495" y="155" width="165" height="85" rx="8"/><rect x="725" y="155" width="195" height="85" rx="8"/><rect x="265" y="305" width="165" height="75" rx="8"/><rect x="495" y="305" width="165" height="75" rx="8"/><rect x="185" y="415" width="590" height="58" rx="8"/></g>
  <g fill="#d9e0dc" font-family="ui-sans-serif, sans-serif" text-anchor="middle"><text x="117" y="190" font-size="16" font-weight="700">Purchased</text><text x="117" y="216" font-size="14">package quantity</text><text x="347" y="190" font-size="16" font-weight="700">Available</text><text x="347" y="216" font-size="14">ready to reserve</text><text x="577" y="190" font-size="16" font-weight="700">Reserved</text><text x="577" y="216" font-size="14">booking requested</text><text x="822" y="190" font-size="16" font-weight="700">Consumed</text><text x="822" y="216" font-size="14">booking confirmed</text><text x="347" y="337" font-size="16" font-weight="700">Refunded</text><text x="347" y="360" font-size="13">eligible purchase reversal</text><text x="577" y="337" font-size="16" font-weight="700">Forfeited</text><text x="577" y="360" font-size="13">expired / non-refundable</text><text x="480" y="441" font-family="ui-monospace, monospace" font-size="15" font-weight="700">BookingEntitlementEntry · append-only movement history</text><text x="480" y="461" font-size="12">activate · reserve · release · consume · adjust · refund · forfeit</text></g>
  <g stroke="#75bfff" stroke-width="3" fill="none"><path d="M200 197h65"/><path d="M430 197h65"/><path d="M660 197h65"/><path d="M347 240v65"/><path d="M430 220h25v122h40"/><path d="M430 380l95 35"/><path d="M577 380l-70 35"/></g>
  <g fill="#75bfff"><path d="M265 197l-10-6v12z"/><path d="M495 197l-10-6v12z"/><path d="M725 197l-10-6v12z"/><path d="M347 305l-6-10h12z"/><path d="M495 342l-10-6v12z"/><path d="M525 415l-11-1 6-9z"/><path d="M507 415l7-9 4 10z"/></g>
  <text x="465" y="270" text-anchor="start" fill="#929e98" font-family="ui-sans-serif, sans-serif" font-size="12">expiry · forfeit</text>
  <text x="480" y="130" text-anchor="middle" fill="#86d99a" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.5">ALL BALANCE MOVES UNDER ENTITLEMENT ROW LOCK</text>
</svg>
