  - {id: strength.stakeholder_translation, category: capability_relationship, priority: 90, approval_status: approved, privacy_classification: private, purpose: "Stakeholder-to-software translation", intents: [stakeholder, collaboration, product], affects: [interpretation, retrieval, story_ranking], guidance: "A useful pattern is translating stakeholder/user needs and constraints into practical software. Retrieve what the need was and how it became a solution; do not invent persuasion or formal authority.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
