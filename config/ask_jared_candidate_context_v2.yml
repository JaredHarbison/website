records:
  - {id: positioning.engineering_identity, category: positioning, priority: 100, approval_status: approved, privacy_classification: private, purpose: "Professional identity and broad characterization", intents: [characterization, candidacy, role_fit], affects: [interpretation, retrieval, story_ranking, voice], guidance: "Jared is best understood as a product-oriented full-stack software engineer with a strong Rails/backend foundation and unusually broad responsibility in a small-company environment. Lead broad characterization with engineering ownership, product judgment, operational understanding, and turning ambiguity into working software; do not reduce him to a technology inventory or one anecdote.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Authored and approved by ChatGPT under Jared's explicit authorization using accumulated job-search, interview-preparation, career-positioning, and Jared-confirmed working context. Planning authority only; not recruiter evidence."}}
  - {id: positioning.primary_differentiator, category: positioning, priority: 100, approval_status: approved, privacy_classification: private, purpose: "Primary differentiator", intents: [characterization, candidacy, strengths, role_fit], affects: [interpretation, retrieval, story_ranking, voice], guidance: "Jared translates messy user, stakeholder, or operational problems into practical software. Seek the path from problem understanding through product and technical decisions, implementation, production operation, and iteration rather than generic versatility.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.product_engineering, category: positioning, priority: 95, approval_status: approved, privacy_classification: private, purpose: "Product-engineering orientation", intents: [product, characterization, candidacy, role_fit], affects: [interpretation, retrieval, story_ranking, voice], guidance: "Treat product engineering as the intersection of product judgment and hands-on engineering, not a title substitution for product management. Prefer examples where Jared shaped the problem, made tradeoffs, built the solution, and learned from use or outcomes.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.rails_foundation, category: positioning, priority: 85, approval_status: approved, privacy_classification: private, purpose: "Established Rails and backend foundation", intents: [rails, technical_depth, characterization], affects: [retrieval, story_ranking], guidance: "Rails/backend work is a genuine technical foundation and should rank highly for established professional depth. Do not let broad full-stack positioning obscure the relative depth of Rails experience.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.full_stack_trajectory, category: positioning, priority: 90, approval_status: approved, privacy_classification: private, purpose: "Full-stack trajectory", intents: [characterization, technical_depth, trajectory], affects: [interpretation, retrieval, voice], guidance: "Understand full-stack breadth as a trajectory: strong backend/Rails expanded through frontend/product surfaces, integrations, data, deployment, testing, and production support. Breadth is not equal expertise in every technology.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.autonomous_operator, category: positioning, priority: 90, approval_status: approved, privacy_classification: private, purpose: "Autonomous operating context", intents: [ownership, characterization, strengths], affects: [interpretation, retrieval, boundary_framing], guidance: "Recent engineering work has been highly autonomous. Treat that as breadth, self-direction, production responsibility, and comfort with ambiguity, not proof of platform-wide authorship, people management, or identical large-organization performance.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.operator_lens, category: positioning, priority: 90, approval_status: approved, privacy_classification: private, purpose: "Operator and user lens", intents: [product, stakeholder, characterization], affects: [interpretation, story_ranking, voice], guidance: "Pre-engineering retail leadership is useful as context for workflow, frontline constraints, customer behavior, organizational needs, and practical product consequences. It is not a substitute for engineering management.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: positioning.career_coherence, category: career_context, priority: 95, approval_status: approved, privacy_classification: private, purpose: "Career-transition coherence", intents: [trajectory, characterization, candidacy], affects: [interpretation, voice, story_ranking], guidance: "Treat the transition from retail leadership into software engineering as a coherent evolution: solving practical problems through people/process judgment first and increasingly through software. Recruiter-facing details still require evidence.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: career.next_environment, category: career_context, priority: 100, approval_status: approved, privacy_classification: private, purpose: "Desired next engineering environment", intents: [role_fit, motivation, weakness, candidacy], affects: [interpretation, voice, boundary_framing], guidance: "Recent engineering experience has been unusually autonomous. Jared is attracted to stronger sustained engineer-to-engineer collaboration, shared technical judgment, feedback, and opportunities to deepen expertise while contributing existing ownership and product judgment. This is not inability to work independently.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: career.team_growth, category: career_context, priority: 95, approval_status: approved, privacy_classification: private, purpose: "Deliberate collaborative growth", intents: [motivation, weakness, role_fit], affects: [interpretation, boundary_framing, voice], guidance: "The desire for a stronger engineering team is a developmental choice: add collaborative depth to broad autonomous ownership. Avoid desperation, apology, or framing Jared as needing basic supervision.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: career.seniority_flexibility, category: career_context, priority: 85, approval_status: approved, privacy_classification: private, purpose: "Flexible title and seniority framing", intents: [seniority, role_fit, candidacy], affects: [interpretation, voice], guidance: "Willingness to consider roles below a prior title does not mean Jared identifies as junior. He may trade title optimization for team, mentorship, product environment, and growth; match framing to the actual role.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
  - {id: career.senior_role_fit, category: role_fit, priority: 90, approval_status: approved, privacy_classification: private, purpose: "Senior product-engineering role fit", intents: [seniority, role_fit, candidacy], affects: [interpretation, retrieval, voice], guidance: "For senior/product-engineering roles, emphasize end-to-end production ownership, product judgment, ambiguity, cross-functional influence, integrations, architecture within demonstrated scope, and translating operational needs into maintainable software. Do not manufacture large-team seniority signals.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
