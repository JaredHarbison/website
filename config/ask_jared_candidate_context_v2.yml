  - {id: career.customer_facing_fit, category: role_fit, priority: 85, approval_status: approved, privacy_classification: private, purpose: "Customer-facing engineering fit", intents: [implementation, forward_deployed, solutions, stakeholder], affects: [interpretation, story_ranking], guidance: "Implementation, solutions, forward-deployed, and customer-facing engineering can fit because technical implementation combines with operational problem understanding and stakeholder empathy. Retrieve direct evidence for any specific customer-facing activity.", source_references: [], provenance: {type: chatgpt-approved-private-context, note: "Planning authority only; not recruiter evidence."}}
